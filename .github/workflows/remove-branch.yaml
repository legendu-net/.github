name: Remove Branches
on:
  workflow_call:
    inputs:
      pattern:
        required: false
        type: string
        default: '^(?!(main|dev)$)'
jobs:
  remove_branch:
    runs-on: ubuntu-latest
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Remove Branches
        run: |
          uvx --from github-rest-api@latest remove_branch \
            --repo ${{ github.repository }} \
            --pattern '${{ inputs.pattern }}' \
            --token ${{ secrets.ACTIONS_TOKEN }}
