name: Lint Code

on:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    # `lint_repo` (github-rest-api) detects the languages in the repository and
    # lints each of them. The image bundles it together with every tool it needs
    # (ruff, ty, shfmt, shellcheck, stylua, selene, mdformat, codespell, lychee, ...).
    container:
      image: quay.io/legendu/lint:next
    steps:
      - uses: actions/checkout@v6
      # - name: Allow git in container workspace
      #   run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Lint code
        run: lint_repo
