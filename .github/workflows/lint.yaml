name: Lint Code

on:
  workflow_call:

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.detect.outputs.python }}
      rust: ${{ steps.detect.outputs.rust }}
      golang: ${{ steps.detect.outputs.golang }}
      bash: ${{ steps.detect.outputs.bash }}
      fish: ${{ steps.detect.outputs.fish }}
      lua: ${{ steps.detect.outputs.lua }}
    steps:
      - uses: actions/checkout@v6
      - id: detect
        run: |
          have() { [ -n "$(git ls-files -- "$@" | head -1)" ]; }

          if   have pyproject.toml; then python=project
          elif have '*.py';         then python=scripts
          else                           python=; fi

          if   have Cargo.toml;     then rust=project
          elif have '*.rs';         then rust=scripts
          else                           rust=; fi

          if   have go.mod;         then golang=module
          else                           golang=; fi

          if   have '*.sh';         then bash=scripts
          else                           bash=; fi

          if   have '*.fish';       then fish=scripts
          else                           fish=; fi

          if   have '*.lua';        then lua=scripts
          else                           lua=; fi

          {
            echo "python=$python"
            echo "rust=$rust"
            echo "golang=$golang"
            echo "bash=$bash"
            echo "fish=$fish"
            echo "lua=$lua"
          } >> "$GITHUB_OUTPUT"

  lint-python-project:
    needs: detect
    if: needs.detect.outputs.python == 'project'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Check pyproject.toml formatting
        run: uv run pyproject-fmt --check pyproject.toml
      - name: Check code formatting
        run: uv run ruff format --check ./
      - name: Lint with ruff
        run: uv run ruff check
      - name: Lint with Ty
        run: uv run ty check
      - name: Analyze Dependencies
        run: uv run deptry .

  lint-python-scripts:
    needs: detect
    if: needs.detect.outputs.python == 'scripts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Check code formatting
        run: uvx ruff format --check .
      - name: Lint with ruff
        run: uvx ruff check --extend-select I,RUF022 .
      - name: Lint with Ty
        run: |
          status=0
          for f in $(git ls-files -- '*.py'); do
            grep -q '^# /// script' "$f" || continue
            echo "::group::ty $f"
            uv sync --script "$f" \
              && uvx ty check --python "$(uv python find --script "$f")" "$f" \
              || status=1
            echo "::endgroup::"
          done
          exit $status

  lint-rust-project:
    needs: detect
    if: needs.detect.outputs.rust == 'project'
    runs-on: ubuntu-latest
    container:
      image: dclong/rust-cicd
    steps:
      - uses: actions/checkout@v6
      - name: Check Code Formatting
        run: |
          cargo fmt --all -- --check

  lint-rust-scripts:
    needs: detect
    if: needs.detect.outputs.rust == 'scripts'
    runs-on: ubuntu-latest
    container:
      image: dclong/rust-cicd
    steps:
      - uses: actions/checkout@v6
      - name: Allow git in container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check Code Formatting
        run: git ls-files -- '*.rs' | xargs -r rustfmt --check --edition 2024

  lint-bash-scripts:
    needs: detect
    if: needs.detect.outputs.bash == 'scripts'
    runs-on: ubuntu-latest
    env:
      # Installed from pinned GitHub releases rather than `apt install`:
      # apt on the GitHub-hosted Ubuntu runners has repeatedly hung on this
      # job (needrestart's interactive prompt stalling a supposedly
      # noninteractive install). Bump these deliberately, and when shfmt is
      # bumped run `shfmt -i 4 -ci -w .` locally in the same commit so the
      # tree matches whatever the new version considers formatted.
      SHFMT_VERSION: '3.13.1'
      SHELLCHECK_VERSION: '0.11.0'
    steps:
      - uses: actions/checkout@v6
      - name: Install shfmt and shellcheck
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cd "$tmp"
          curl -sSLf -o shfmt \
              "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          curl -sSLf -o shellcheck.tar.xz \
              "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar xf shellcheck.tar.xz
          sudo install -m 755 shfmt "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
          shfmt --version
          shellcheck --version
      - name: Check Shell Formatting
        run: git ls-files -- '*.sh' | xargs -r shfmt -i 4 -ci -d
      - name: Lint Shell Script
        run: git ls-files -- '*.sh' | xargs -r shellcheck

  lint-fish-scripts:
    needs: detect
    if: needs.detect.outputs.fish == 'scripts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install icon
        run: curl -sSL https://raw.githubusercontent.com/legendu-net/icon/main/install_icon.sh | sudo bash -
      - name: Install the Fish Shell
        run: icon fish -i
      - name: Check Code Formatting
        shell: fish {0}
        run: git ls-files -- '*.fish' | xargs -r fish_indent -c
      - name: Lint Code
        shell: fish {0}
        run: git ls-files -- '*.fish' | xargs -r fish -n

  lint-golang:
    needs: detect
    if: needs.detect.outputs.golang == 'module'
    runs-on: ubuntu-latest
    container:
      image: golangci/golangci-lint:v2.6.2-alpine
    steps:
      - uses: actions/checkout@v6
      - name: Check Code Formatting
        run: golangci-lint fmt -d
      - name: Lint Code
        run: GOFLAGS=-buildvcs=false golangci-lint run

  lint-lua-scripts:
    needs: detect
    if: needs.detect.outputs.lua == 'scripts'
    runs-on: ubuntu-latest
    env:
      # Both tools are installed from their official GitHub releases at
      # pinned versions rather than tracking the latest: a floating version
      # lets an upstream formatting or lint change turn a previously green
      # branch red without anything here having changed. Bump the versions
      # below deliberately, and when stylua is bumped run `stylua .` locally
      # in the same commit so the tree matches whatever the new version
      # considers formatted.
      #
      # Note the asymmetry in the release tags these build into: stylua tags
      # its releases `v2.5.2`, selene tags its own `0.31.0`, without the
      # leading `v`.
      STYLUA_VERSION: '2.5.2'
      SELENE_VERSION: '0.31.0'
    steps:
      - uses: actions/checkout@v6
      - name: Install stylua and selene
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          cd "$tmp"
          curl -sSLf -o stylua.zip \
              "https://github.com/JohnnyMorganz/StyLua/releases/download/v${STYLUA_VERSION}/stylua-linux-x86_64.zip"
          curl -sSLf -o selene.zip \
              "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-${SELENE_VERSION}-linux.zip"
          unzip -q stylua.zip
          unzip -q selene.zip
          # `install -m 755` rather than `cp`/`mv`: selene's archive stores its
          # binary as mode 644, so a plain copy lands something non-executable.
          sudo install -m 755 stylua selene /usr/local/bin/
          stylua --version
          selene --version
      - name: Check formatting with stylua
        shell: bash
        run: |
          set -euo pipefail
          if ! stylua --check .; then
              echo "Run \`stylua .\` to apply the formatting shown above." >> "$GITHUB_STEP_SUMMARY"
              echo "::error::Some Lua files are not formatted according to .stylua.toml."
              exit 1
          fi
      # selene exits nonzero for warnings as well as errors, which is wanted
      # here: the rules left enabled in `selene.toml` are all worth acting on.
      - name: Lint with selene
        shell: bash
        run: |
          set -euo pipefail
          selene .
